openapi: 3.0.0
info:
  title: Admin Simple API
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.admin-simple.com
    description: Production server
paths:
  /login:
    post:
      tags:
        - auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The user's email address
                password:
                  type: string
                  description: The user's password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9; Path=/; HttpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The access token
                    format: jwt
                  refresh_token:
                    type: string
                    description: The refresh token
                    format: jwt
                required:
                  - access_token
                  - refresh_token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message
  /me:
    get:
      tags:
        - auth
      summary: Get current user
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message
  /logout:
    post:
      tags:
        - auth
      summary: Logout
      description: Logs the user out by clearing the authentication cookies.
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=; HttpOnly; Path=/; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
  /products:
    get:
      tags:
        - products
      summary: Get all products
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /tasks:
    get:
      tags:
        - tasks
      summary: Get all tasks
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /tasks/category:
    get:
      tags:
        - tasks
      summary: Get all task categories
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      responses:
        '200':
          description: A list of task categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskCategory'
  /tasks/{id}:
    get:
      tags:
        - tasks
      summary: Get a task by ID
      security:
        - accessTokenAuth: []
        - refreshTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task not found
components:
  securitySchemes:
    accessTokenAuth:
      type: apiKey
      in: cookie
      name: access_token
    refreshTokenAuth:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    UserRoles:
      type: object
      properties:
        role:
          type: string
          enum:
            - user
            - admin
            - superadmin
            - sale
            - marketing
          description: The role of the user
        permissions_groups:
          type: array
          items:
            type: string
          description: The permissions groups of the user
        permissions:
          type: array
          items:
            type: string
          description: The permissions of the user
      required:
        - role
        - permissions_groups
        - permissions
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the user
        name:
          type: string
          description: The name of the user
        email:
          type: string
          format: email
          description: The email address of the user
        address:
          type: object
          properties:
            street:
              type: string
              description: The street of the user
            city:
              type: string
              description: The city of the user
            state:
              type: string
              description: The state of the user
            zip:
              type: string
              description: The zip code of the user
            country:
              type: string
              description: The country of the user
        phone:
          type: string
          description: The phone number of the user
        website:
          type: string
          description: The website of the user
        gender:
          type: string
          enum:
            - male
            - female
            - other
          description: The gender of the user
        roles:
          $ref: '#/components/schemas/UserRoles'
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
          description: The status of the user
        created_at:
          type: string
          format: date-time
          description: The date and time the user was created
      required:
        - id
        - name
        - email
        - address
        - phone
        - website
        - gender
        - roles
        - status
        - created_at
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the product
        name:
          type: string
          description: The name of the product
        description:
          type: string
          description: The description of the product
        price:
          type: number
          description: The price of the product
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
          description: The status of the product
        category:
          type: string
          description: The category of the product
        image:
          type: string
          description: The image of the product
        stock:
          type: number
          description: The stock of the product
        brand:
          type: string
          description: The brand of the product
        tags:
          type: array
          items:
            type: string
          description: The tags of the product
        attributes:
          type: object
          properties:
            color:
              type: string
              description: The color of the product
            size:
              type: string
              description: The size of the product
            weight:
              type: number
              description: The weight of the product
            dimensions:
              type: object
              properties:
                length:
                  type: number
                width:
                  type: number
                height:
                  type: number
        createdAt:
          type: string
          format: date-time
          description: The date and time the product was created
      required:
        - id
        - name
        - description
        - price
        - status
        - category
        - image
        - stock
        - brand
        - tags
        - attributes
        - created_at
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the task
        title:
          type: string
          description: The title of the task
        progress_percent:
          type: number
          description: The progress percentage of the task
          minimum: 0
          maximum: 100
          example: 25
        description:
          type: string
          description: The description of the task
        status:
          type: string
          enum:
            - Pending
            - In Progress
            - Cancelled
            - Backlog
            - Todo
            - In Review
            - Completed
          description: The status of the task
        category:
          $ref: '#/components/schemas/TaskCategory'
        priority:
          type: string
          enum:
            - Low
            - Medium
            - High
          description: The priority of the task
        due_date:
          type: string
          format: date-time
          description: The due date of the task
        created_at:
          type: string
          format: date-time
          description: The date and time the task was created
        updated_at:
          type: string
          format: date-time
          description: The date and time the task was updated
      required:
        - id
        - title
        - description
        - progress_percent
        - status
        - category
        - priority
        - due_date
        - created_at
        - updated_at
    TaskCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the task category
        name:
          type: string
          description: The name of the task category
      required:
        - id
        - name
